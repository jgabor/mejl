[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/mejl"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jgabor/mejl"

[workspace.dependencies]
# Internal. crates.io needs a version on each one. Keep it equal to
# workspace.package.version when you bump it.
mejl-jmap = { path = "crates/mejl-jmap", version = "0.2.0" }
mejl-fake = { path = "crates/mejl-fake", version = "0.2.0" }
mejl-store = { path = "crates/mejl-store", version = "0.2.0" }
mejl-sync = { path = "crates/mejl-sync", version = "0.2.0" }
mejl-sieve = { path = "crates/mejl-sieve", version = "0.2.0" }
mejl-render = { path = "crates/mejl-render", version = "0.2.0" }
mejl-ui = { path = "crates/mejl-ui", version = "0.2.0" }

# TUI
ratatui = "0.30.2"
crossterm = { version = "0.29.0", features = ["osc52"] }
ratatui-textarea = "0.9.3"
unicode-width = "0.2"
unicode-segmentation = "1.13"

# Async and HTTP
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net", "io-util"] }
tokio-util = "0.7.20"
futures = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "json", "stream", "gzip"] }
sse-stream = "0.3.0"
bytes = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# Mail and HTML
# Sanitizes HTML before "Open in browser".
ammonia = "4.2.4"
mail-parser = "0.11.9"
mail-builder = "1.0.0"
html2text = "0.17.4"
linkify = "0.11.0"
pulldown-cmark = { version = "0.13.0", default-features = false, features = ["html"] }
mime_guess = "2"

# Cache and search
rusqlite = { version = "0.40.2", features = ["bundled"] }

# Pickers

# Config, secrets, paths, CLI
toml = "1.1.8"
# Edits the config file in place without losing the user's comments.
toml_edit = "0.25.17"
etcetera = "0.11.0"
keyring = "4.2.0"
secrecy = "0.10.3"
clap = { version = "4.6.7", features = ["derive"] }

# Misc
jiff = { version = "0.2.38", features = ["serde"] }
anyhow = "1.0.104"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = "0.2.5"
open = "5.4.5"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.4"
libc = "0.2"
signal-hook = "0.3"

# Tests and benches
insta = "1.49.0"
divan = "0.1.21"
tempfile = "3"
axum = "0.8"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 1
