# Builds mejl for Linux and macOS, publishes a GitHub release and publishes
# the crates to crates.io when a version tag such as v0.1.0 is pushed.
# `just release 0.1.0` makes and pushes the tag.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, for example v0.1.0"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Version matches the tag
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "mejl") | .version')
          if [ "v$version" != "$TAG" ]; then
            echo "Cargo.toml says $version, the tag is $TAG" >&2
            exit 1
          fi
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  build:
    name: Build ${{ matrix.target }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked -p mejl --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="mejl-$TAG-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/mejl" "$name/"
          cp README.md LICENSE-MIT LICENSE-APACHE "$name/"
          tar -czf "$name.tar.gz" "$name"
          if command -v sha256sum >/dev/null; then
            sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          else
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: mejl-${{ matrix.target }}
          path: mejl-*.tar.gz*

  release:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "${{ github.repository }}" \
            --title "mejl ${TAG#v}" \
            --generate-notes \
            --verify-tag

  # Logs in with crates.io trusted publishing, so no token is stored in the
  # repository. Each crate needs this workflow added as a trusted publisher
  # in its settings on crates.io.
  crates-io:
    name: Publish to crates.io
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Leaves out crates whose version is already on crates.io, so a rerun
      # after a partial publish carries on where it stopped.
      - name: Find the crates to publish
        id: pending
        run: |
          exclude=""
          pending=0
          for name in $(cargo metadata --no-deps --format-version 1 | jq -r '.packages[].name'); do
            version=$(cargo metadata --no-deps --format-version 1 \
              | jq -r --arg n "$name" '.packages[] | select(.name == $n) | .version')
            index="https://index.crates.io/${name:0:2}/${name:2:2}/$name"
            if curl -sfL "$index" | jq -e --arg v "$version" 'select(.vers == $v)' >/dev/null; then
              echo "$name $version is already on crates.io"
              exclude="$exclude --exclude $name"
            else
              pending=$((pending + 1))
            fi
          done
          echo "exclude=$exclude" >> "$GITHUB_OUTPUT"
          echo "pending=$pending" >> "$GITHUB_OUTPUT"
      - name: Authenticate with crates.io
        id: auth
        if: steps.pending.outputs.pending != '0'
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish
        if: steps.pending.outputs.pending != '0'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --workspace --locked ${{ steps.pending.outputs.exclude }}
